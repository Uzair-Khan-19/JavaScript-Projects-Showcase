<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="CSS-folder/calculator.css">
</head>

<body>
  <div class="container">
      <div class="calculator">
        <p>Calculator</p>
      </div>
    <div class="result-container">
      <p class="display-cal"></p>
    </div>
    
    <div>
      <button class="number-button"
      onclick="equal('1')"
      >1</button>
    
      <button class="number-button"
        onclick="equal('2')"
        >2</button>
    
      <button class="number-button"
      onclick="equal('3')">
        3</button>
    
      <button class="option-button"
      onclick="equal('+')">
        +</button>
    </div>
    
    <div>
      <button class="number-button"
      onclick="equal('4')"
      >4</button>
    
      <button class="number-button"
        onclick="equal('5')"
      >5</button>
    
      <button class="number-button"
      onclick="equal('6')">
      6</button>
    
      <button class="option-button"
      onclick="equal('-')">
      -</button>
    </div>

    <div>
      <button class="number-button"
      onclick="equal('7')"
      >7</button>
    
      <button class="number-button"
      onclick="equal('8')"
      >8</button>
    
      <button class="number-button"
      onclick="equal('9')">
      9</button>
    
      <button class="option-button"
      onclick="equal('*')">
      *</button>
    </div>
    
  <div>
    <button class="number-button" 
    onclick="equal('.')"
    >.</button>
    
    <button class="number-button"
    onclick="equal('0')"
    >0</button>
  
    
    <button class="number-button"
      onclick="calculation = eval(calculation)
        displayCalculation()
        localStorage.setItem('calculation' , calculation)">
      =</button>
      
      <button class="option-button"
        onclick="equal('/')">
      /</button>
    </div>

    <button class="clear-button"
      onclick="calculation = ''
        displayCalculation()
        localStorage.setItem('calculation' , calculation)
    ">Clear</button>
  </div>
      
 <script src="Javascript-folder/calculator.js"></script>
</body>
</html>
