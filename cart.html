<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables</title>
   <link rel="stylesheet" href="CSS-folder/cart.css">
</head>
<body>
    <h3>Amazon Cart Service</h3>
    <button onclick="
        if (cartQuantity > 10) {
            console.log('Cart is full')
        }
            console.log(`Cartquantity ${cartQuantity} `)
    ">Show Quantity</button>
    
    <button onclick="
        updateQuantity(1)
    ">Add Item</button>
    
    <button onclick="
        updateQuantity(2)
    ">+2 Items</button>
    
    <button onclick="
        updateQuantity(3)
    ">+3 Items</button>
    
    <button onclick="
        updateQuantity(-1)
    ">-1 Item</button>
    
    <button onclick="
        updateQuantity(-2)
    ">-2 Items</button>
    
    <button onclick="
        updateQuantity(-3)
    ">-3 Items</button>

    <button onclick="
    cartQuantity = 0 
    console.log('Cart was reset!')
    console.log(`cartQuantity ${cartQuantity}`);
    liveCart()
    ">Reset Items</button>
    <p class="js-item"></p>
    <script src="Javascript-folder/cart.js"></script>
</body>
</html>
